name: Radar GO

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notification de test"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les événements
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ github.event.inputs.test == 'true' && '1' || '0' }}
        run: python radar.py
      - name: Mettre à jour l'appli
        run: |
          python radar.py --feed docs/feed.json
          python icons.py
      - name: Sauvegarder l'état
        run: |
          git config user.name "radar-go"
          git config user.email "radar-go@users.noreply.github.com"
          git add state.json details.json fr_names.json translations.json docs
          git diff --cached --quiet || git commit -m "Mise à jour du radar"
          git push
