<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Radar GO</title>
<meta name="theme-color" content="#0aa3b5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout : en-tête radar, vedette du moment + liste « en cours », barre de filtres collante, grille de cartes illustrées ou vue semaine, fiche détaillée en fenêtre. */
:root{
  --bg:#eaf3f2; --surface:#ffffff; --sunk:#f3f8f7; --ink:#12313a; --muted:#587680; --line:#d3e3e2;
  --accent:#0a9fb1; --accent-ink:#ffffff;
  --raid:#d6336c; --dyna:#a8259a; --star:#d97a06; --event:#0b8fa8; --league:#4c5fd5; --other:#7b6650;
  --good:#1f9d55; --mid:#d98a06; --low:#8a9aa0; --live:#e0315b;
  --display:"Fredoka","Nunito Sans",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --shadow:0 1px 2px rgb(18 49 58/.06),0 6px 20px rgb(18 49 58/.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1a1f; --surface:#132a31; --sunk:#0f2228; --ink:#e4f2f1; --muted:#8fb0b6; --line:#23424a;
  --accent:#2cc4d4; --accent-ink:#06262c;
  --raid:#ff6f9c; --dyna:#e062d2; --star:#ffb44d; --event:#43c5de; --league:#8f9eff; --other:#c7ad8f;
  --good:#4fd389; --mid:#ffbe4d; --low:#7d959b; --live:#ff5c7f;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 8px 24px rgb(0 0 0/.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a1f; --surface:#132a31; --sunk:#0f2228; --ink:#e4f2f1; --muted:#8fb0b6; --line:#23424a;
  --accent:#2cc4d4; --accent-ink:#06262c;
  --raid:#ff6f9c; --dyna:#e062d2; --star:#ffb44d; --event:#43c5de; --league:#8f9eff; --other:#c7ad8f;
  --good:#4fd389; --mid:#ffbe4d; --low:#7d959b; --live:#ff5c7f;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 8px 24px rgb(0 0 0/.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{font-size:clamp(28px,5vw,40px);font-weight:700;line-height:1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.radar{width:52px;height:52px;border-radius:50%;flex:none;position:relative;overflow:hidden;
  background:radial-gradient(circle,transparent 30%,color-mix(in srgb,var(--accent) 25%,transparent) 31%,transparent 33%,transparent 62%,color-mix(in srgb,var(--accent) 25%,transparent) 63%,transparent 65%),color-mix(in srgb,var(--accent) 12%,var(--surface));
  border:2px solid var(--accent)}
.radar::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 70%,transparent),transparent 25%);animation:sweep 3s linear infinite}
.radar::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--raid);top:14px;left:31px;box-shadow:0 0 0 3px color-mix(in srgb,var(--raid) 30%,transparent)}
@keyframes sweep{to{transform:rotate(360deg)}}
.clock{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.clock b{font:600 26px/1 var(--display)}
.clock small{color:var(--muted);font-size:12.5px}

/* Hero 3D */
.h3d{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;gap:10px;border-radius:28px;overflow:hidden;
  background:radial-gradient(90% 120% at 75% 50%,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 70%);border:1px solid var(--line);min-height:380px}
.h3d-txt{padding:28px 0 28px 30px;display:flex;flex-direction:column;gap:12px;z-index:1;min-width:0}
.h3d .brand h1{font-size:clamp(38px,6vw,64px)}
.h3d .lead{margin:0;font-size:17px;color:var(--muted);max-width:30ch}
.h3d .clock{align-items:flex-start;text-align:left}
.next{align-self:flex-start;display:flex;flex-direction:column;gap:2px;text-align:left;border:0;cursor:pointer;border-radius:16px;padding:10px 14px;max-width:100%;
  background:color-mix(in srgb,var(--raid) 12%,var(--surface));color:var(--ink);box-shadow:var(--shadow)}
.next small{font-weight:800;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--raid)}
.next b{font:600 16px/1.2 var(--display)}
.next span{font-size:13px;color:var(--muted)}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.stage{position:relative;height:100%;min-height:380px}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
#globe:active{cursor:grabbing}
@media (max-width:760px){
  .h3d{grid-template-columns:minmax(0,1fr);min-height:0}
  .stage{order:-1;min-height:280px;height:280px}
  .h3d-txt{padding:0 18px 22px}
}

/* Vedette */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.feature{position:relative;border-radius:24px;overflow:hidden;cursor:pointer;color:var(--ink);
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--surface)),color-mix(in srgb,var(--c) 6%,var(--surface)));
  border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:22px;min-height:250px}
.feature .eyebrow{font:800 11.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.feature h2{font-size:clamp(24px,3.6vw,34px);line-height:1.08;margin:10px 0 8px}
.feature .txt{display:flex;flex-direction:column;gap:6px;min-width:0;z-index:1}
.feature .why{color:var(--muted);font-size:14px;max-width:46ch}
.feature .pics{display:flex;align-items:flex-end;justify-content:flex-end;min-width:0}
.feature .pics img{width:min(190px,34vw);height:auto;filter:drop-shadow(0 10px 18px rgb(0 0 0/.18));margin-left:-48px}
.feature .pics img:first-child{margin-left:0}
.feature .ring{position:absolute;top:18px;right:18px}
.feature .big-ico{width:120px;height:120px;color:var(--c);opacity:.85;align-self:center}
.side{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.side h2{font-size:18px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px color-mix(in srgb,var(--live) 22%,transparent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--live) 0%,transparent)}}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.row:hover{background:var(--sunk)}
.row .mini{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.row .mini img{width:40px;height:40px;object-fit:contain}
.row .mini svg{width:22px;height:22px}
.row .t{min-width:0;flex:1}
.row .t b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);padding:18px;text-align:center}

/* Barre de filtres */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  margin-inline:-6px;padding:10px 6px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chip svg{width:16px;height:16px;color:var(--c,var(--accent))}
.chip .n{font-size:12px;color:var(--muted);font-weight:600}
.chip[aria-pressed="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--accent-ink)}
.chip[aria-pressed="true"] svg,.chip[aria-pressed="true"] .n{color:inherit}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;min-width:0}
.search input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;cursor:pointer;user-select:none}
.sw input{accent-color:var(--accent);width:17px;height:17px}
.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Cartes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.day{font:600 15px var(--display);color:var(--muted);grid-column:1/-1;margin-top:8px;text-transform:capitalize}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease;text-align:left;padding:0;color:var(--ink)}
.ev:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ev.live{border-color:color-mix(in srgb,var(--live) 50%,var(--line))}
.art{position:relative;height:118px;display:flex;align-items:flex-end;justify-content:center;padding:6px 10px 0;
  background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--c) 26%,var(--surface)),color-mix(in srgb,var(--c) 8%,var(--surface)))}
.art img{height:112px;width:auto;margin-inline:-14px;filter:drop-shadow(0 6px 10px rgb(0 0 0/.16))}
.art .ico{width:64px;height:64px;color:var(--c);align-self:center;opacity:.9}
.art .more{position:absolute;bottom:8px;right:10px;font-size:12px;font-weight:800;background:var(--surface);border-radius:999px;padding:2px 8px;color:var(--muted)}
.art .ring{position:absolute;top:10px;right:10px}
.art .tag{position:absolute;top:10px;left:10px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--c);border-radius:999px;padding:4px 10px 4px 7px;font-weight:800;font-size:12px}
.tag svg{width:15px;height:15px}
.ev .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ev h3{font-size:17.5px;line-height:1.2}
.when{font-size:13.5px;color:var(--muted)}
.when b{color:var(--ink);font-weight:700}
.st{align-self:flex-start;font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--sunk);color:var(--muted)}
.st.live{background:color-mix(in srgb,var(--live) 14%,var(--surface));color:var(--live)}
.st.soon{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.icons{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.icons img{width:26px;height:26px;image-rendering:pixelated;background:var(--sunk);border-radius:8px;padding:1px}
.ring{--p:50;--col:var(--mid);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--col) calc(var(--p)*1%),color-mix(in srgb,var(--col) 16%,var(--surface)) 0)}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 14px var(--display)}
.ring.lg{width:66px;height:66px}.ring.lg span{width:54px;height:54px;font-size:18px}

/* Semaine */
.wk-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.wk-head h2{font-size:20px}
.wk-nav{display:flex;gap:6px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}
.long{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.long h3{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.span{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.span button{min-width:0;border:0;border-radius:8px;padding:5px 9px;font-weight:700;font-size:12.5px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;min-height:160px;display:flex;flex-direction:column;gap:6px;min-width:0}
.col.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.col h4{margin:0 0 4px;font:600 14px var(--display);text-transform:capitalize}
.col h4 small{display:block;font:600 12px var(--body);color:var(--muted)}
.slot{border:0;text-align:left;border-radius:10px;padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:2px;
  background:color-mix(in srgb,var(--c) 13%,var(--surface));color:var(--ink);min-width:0}
.slot time{font-size:12px;font-weight:800;color:var(--c)}
.slot b{font-size:12.5px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
.slot .sp{display:flex;margin-top:2px}.slot .sp img{width:30px;height:30px;margin-right:-6px}
@media (max-width:860px){.cal{grid-template-columns:minmax(0,1fr)}.col{min-height:0}.span{grid-template-columns:minmax(0,1fr)}.span button{grid-column:auto!important}}

/* Fiche détail */
dialog{border:0;padding:0;border-radius:24px;width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgb(0 0 0/.35)}
dialog::backdrop{background:rgb(8 22 27/.55);backdrop-filter:blur(3px)}
.dh{position:relative;padding:22px 22px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--surface)),color-mix(in srgb,var(--c) 5%,var(--surface)));display:flex;gap:16px;align-items:flex-start}
.dh .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.dh h2{font-size:clamp(21px,3.4vw,28px);line-height:1.12;padding-right:34px}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);font-size:20px;cursor:pointer;line-height:1}
.db{padding:18px 22px 24px;display:flex;flex-direction:column;gap:20px}
.db h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.db h3 small{font:600 12.5px var(--body);color:var(--muted)}
.time{background:var(--sunk);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mode{align-self:flex-start;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px}
.mode.fr{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.mode.local{background:color-mix(in srgb,var(--mid) 18%,var(--surface));color:var(--mid)}
.mode.city{background:color-mix(in srgb,var(--raid) 15%,var(--surface));color:var(--raid)}
.alt{color:var(--muted);font-size:13px}
.world{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.wrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;align-items:center;font-size:12.5px}
.wrow .lbl{font-weight:700}
.wrow.me .lbl{color:var(--accent)}
.track{position:relative;height:12px;border-radius:6px;background:color-mix(in srgb,var(--line) 70%,var(--surface))}
.track .b{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--mid)}
.wrow.me .track .b{background:var(--accent)}
.track .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--live)}
.wrow .hrs{grid-column:2;color:var(--muted);font-size:11.5px;margin-top:-3px}
.mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.mon{position:relative;border:1.5px solid var(--line);border-radius:16px;padding:8px 8px 10px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:default;text-align:center;color:var(--ink)}
.mon.can{cursor:pointer}
.mon img{width:96px;height:96px;object-fit:contain;transition:transform .2s ease}
.mon.can:hover img{transform:scale(1.06) rotate(-3deg)}
.mon b{font-size:13px;line-height:1.2;font-weight:700}
.mon .sh{position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;color:var(--star);background:var(--surface);border-radius:999px;padding:1px 7px}
.mon.on{border-color:var(--star);background:color-mix(in srgb,var(--star) 10%,var(--sunk))}
.bons{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.bons li{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.35}
.bons img{width:34px;height:34px;image-rendering:pixelated;flex:none}
.cta{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:800;border-radius:12px;padding:10px 16px}
/* Images d'événements et noms des Pokémon */
.art.ban{height:150px;padding:0;background:var(--sunk)}
.art .banner{width:100%;height:100%;object-fit:cover;margin:0;filter:none}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who span{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--c) 10%,var(--sunk));border-radius:999px;padding:2px 10px 2px 2px;font-size:12.5px;font-weight:700;max-width:100%}
.who img{width:32px;height:32px;border-radius:50%;background:var(--surface);object-fit:contain;flex:none}
.who .plus{padding:2px 10px;color:var(--muted)}
.feature.has-ban{grid-template-columns:minmax(0,1fr)}
.feature .fban{width:100%;aspect-ratio:16/6;object-fit:cover;border-radius:16px;display:block}
.row .mini.ban{width:64px;background:none}
.row .mini.ban img{width:64px;height:40px;object-fit:cover;border-radius:10px}
.dban{display:block;width:100%;aspect-ratio:16/7;max-height:300px;object-fit:cover}
@media (max-width:560px){
  .clock{align-items:flex-start;text-align:left;flex-direction:row;gap:10px;align-items:baseline;flex-wrap:wrap}
  .clock b{font-size:20px}
  .feature{padding:14px;min-height:0;border-radius:20px}
  .side{padding:14px;border-radius:20px}
  .art.ban{height:170px}
  .dh{padding:16px}.db{padding:16px 16px 20px}
  .mons{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .mon img{width:80px;height:80px}
}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding-top:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="h3d">
    <div class="h3d-txt">

const fmtDay = new Intl.DateTimeFormat("fr-FR", { weekday: "short", day: "numeric", month: "short" });

const d = s => s ? new Date(s) : null;

const TITLE_NAMES = Object.keys(FRDEX).filter(n => n.length >= 4).sort((a, b) => b.length - a.length)

let events = [], updatedAt = "";
const state = { cat: "all", q: "", hotOnly: false, shinyAll: false, view: "list", weekOff: 0 };

function matches(e, now) {
  if (state.cat !== "all" && cat(e) !== state.cat) return false;
  if (state.hotOnly && e.score < 70) return false;
  if (state.q) {
    const q = norm(state.q);
    const hay = norm([e.name, e.type, ...mons(e).map(p => p.name), ...(e.bonuses || [])].join(" "));
    if (!hay.includes(q)) return false;
  }

}
const upcoming = now => events.filter(e => !e.end || d(e.end) > now)

function card(e, now) {

  } else {

function renderList(now) {
  const box = $("#list"); box.replaceChildren();
  const shown = upcoming(now).filter(e => matches(e, now));
  if (!shown.length) { box.append(el("div", "empty day", "Aucun événement pour ces filtres.")); return; }
  const live = shown.filter(e => status(e, now).live), next = shown.filter(e => !status(e, now).live);
  if (live.length) { box.append(el("h2", "day", "En cours")); live.forEach(e => box.append(card(e, now))); }
  let last = "";
  for (const e of next) {
    const k = e.start ? fmtLong.format(d(e.start)) : "Date à venir";
    if (k !== last) { box.append(el("h2", "day", k)); last = k; }
    box.append(card(e, now));
  }
}

function renderWeek(now) {

  const days = [...Array(7)].map((_, i) => { const x = new Date(mon); x.setDate(x.getDate() + i); return x; });
  const wEnd = new Date(+days[6] + 864e5);
  const head = el("div", "wk-head");
  head.append(el("h2", null, `Semaine du ${fmtDay.format(days[0])} au ${fmtDay.format(days[6])}`));
  const nav = el("div", "wk-nav");
  const mk = (t, f) => { const b = el("button", "btn", t); b.type = "button"; b.onclick = f; return b; };
  nav.append(mk("← Précédente", () => { state.weekOff--; render(); }), mk("Cette semaine", () => { state.weekOff = 0; render(); }), mk("Suivante →", () => { state.weekOff++; render(); }));
  head.append(nav); box.append(head);
  const evs = events.filter(e => e.start && matches(e, now));
  const inWeek = evs.filter(e => d(e.start) < wEnd && (d(e.end) || d(e.start)) >= days[0]);
  const isLong = e => e.end && d(e.end) - d(e.start) > 30 * 36e5;
  const longs = inWeek.filter(isLong);
  if (longs.length) {
    const L = el("div", "long"); L.append(el("h3", null, "Sur plusieurs jours"));
    const g = el("div", "span");
    for (const e of longs) {
      const s = Math.max(0, Math.floor((d(e.start) - days[0]) / 864e5)), en = Math.min(6, Math.floor((d(e.end) - 1 - days[0]) / 864e5));
      const b = el("button", null, e.name); b.type = "button"; b.title = `${e.name} · ${range(e.start, e.end)}`;
      b.style.setProperty("--c", CATS[cat(e)].color); b.style.gridColumn = `${s + 1} / ${en + 2}`; b.onclick = () => openEv(e);

    const list = inWeek.filter(e => !isLong(e) && sameDay(d(e.start), day)).sort((a, b) => d(a.start) - d(b.start));

    for (const e of list) {

      s.append(el("time", "num", `${fmtTime.format(d(e.start))}${e.end ? "–" + fmtTime.format(d(e.end)) : ""}`), el("b", null, e.name));

      if (sp.childNodes.length) s.append(sp);

    }

function worldChart(world, now) {
  const t0 = Math.min(...world.map(w => d(w.start))), t1 = Math.max(...world.map(w => d(w.end || w.start)));
  const span = Math.max(t1 - t0, 1), pct = v => ((v - t0) / span) * 100;
  const box = el("div", "world");
  box.append(el("div", "alt", "Le créneau dans chaque pays, en heure française :"));
  for (const w of world) {
    const r = el("div", "wrow" + (w.zone === "France" ? " me" : "")), track = el("div", "track"), b = el("div", "b");
    const s = d(w.start), en = d(w.end || w.start);
    b.style.left = pct(s) + "%"; b.style.width = Math.max(pct(en) - pct(s), 2) + "%"; track.append(b);
    if (now >= t0 && now <= t1) { const n = el("div", "now"); n.style.left = pct(now) + "%"; n.title = "Maintenant"; track.append(n); }
    r.append(el("span", "lbl", w.zone), track, el("span", "hrs num", range(w.start, w.end))); box.append(r);
  }
  return box;
}
function timeBlock(e, now) {

  const fr = el("div"); fr.append(el("b", null, "🇫🇷 En France : "), range(e.start, e.end)); box.append(fr);
  if (t.mode === "fr") box.append(el("span", "mode fr", "Même moment partout dans le monde"));
  if (t.mode === "city") {

}

    const n = k === "all" ? up.length : up.filter(e => cat(e) === k).length;
    if (!n && k !== "all") continue;
    const b = html("button", "chip", ICON[k] + "<span></span>"); b.type = "button"; b.lastChild.textContent = CATS[k].label;
    b.append(el("span", "n num", n)); b.style.setProperty("--c", CATS[k].color);
    b.setAttribute("aria-pressed", state.cat === k); b.onclick = () => { state.cat = k; save(); render(); };
    box.append(b);
  }
}

function render() {
  if (!events.length) return;
  const now = parisNow();
  renderChips(now); renderHero(now);
  $("#list").hidden = state.view !== "list"; $("#week").hidden = state.view !== "week";
  $("#vList").setAttribute("aria-pressed", state.view === "list"); $("#vWeek").setAttribute("aria-pressed", state.view === "week");
  state.view === "list" ? renderList(now) : renderWeek(now);
}
function tick() {
  const now = parisNow();
  $("#clock").textContent = fmtTime.format(now) + " à Paris";
  if (updatedAt) $("#upd").textContent = `Mis à jour ${fmtDay.format(d(updatedAt))} à ${fmtTime.format(d(updatedAt))}`;
}

$("#q").addEventListener("input", ev => { state.q = ev.target.value; render(); });
$("#hotOnly").checked = state.hotOnly; $("#shinyAll").checked = state.shinyAll;
$("#hotOnly").onchange = ev => { state.hotOnly = ev.target.checked; save(); render(); };
$("#shinyAll").onchange = ev => { state.shinyAll = ev.target.checked; save(); render(); };
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { state.view = b.dataset.view; save(); render(); });

// Prochain événement fort (≥ 70 %) qui n'a pas encore commencé
function renderNext() {
  const now = parisNow(), b = $("#next");
  const e = upcoming(now).find(x => x.score >= 70 && x.start && d(x.start) > now);
  if (!e) { b.hidden = true; return; }
  b.hidden = false; b.replaceChildren(el("small", null, "Prochain gros événement"), el("b", null, e.name), el("span", "num", `Dans ${rel(d(e.start) - now)} · ${range(e.start, e.end)}`));
  b.onclick = () => openEv(e);
}

// Globe radar 3D : la Terre avec les fuseaux suivis, et les Pokémon des prochains événements en orbite
const ZONES = [["Nouvelle-Zélande", -41, 174], ["Japon", 36, 139], ["France", 47, 2], ["New York", 41, -74], ["Los Angeles", 34, -118], ["Hawaï", 21, -157]];
function initGlobe() {
  const cv = $("#globe");
  if (!window.THREE || !cv) { if (cv) cv.parentElement.hidden = true; return; }
  const T = THREE, css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let renderer;
  try { renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true }); } catch (err) { cv.parentElement.hidden = true; return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  const scene = new T.Scene(), cam = new T.PerspectiveCamera(38, 1, 0.1, 100);
  cam.position.set(0, 0.35, 6.2); cam.lookAt(0, 0, 0);
  const world = new T.Group(); world.rotation.x = 0.35; scene.add(world);
  const globe = new T.Group(); world.add(globe);
  const R = 1.25, still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Points de la sphère (spirale de Fibonacci)
  const N = 1400, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963;
    pos.set([Math.cos(th) * r * R, y * R, Math.sin(th) * r * R], i * 3);
  }
  const pg = new T.BufferGeometry(); pg.setAttribute("position", new T.BufferAttribute(pos, 3));
  const dotsMat = new T.PointsMaterial({ size: 0.028, transparent: true, opacity: 0.75 });
  globe.add(new T.Points(pg, dotsMat));
  const coreMat = new T.MeshBasicMaterial({ transparent: true, opacity: 0.55 });
  globe.add(new T.Mesh(new T.SphereGeometry(R * 0.985, 48, 32), coreMat));
  // Équateur et anneau de balayage du radar
  const ringMat = new T.MeshBasicMaterial({ transparent: true, opacity: 0.5, side: T.DoubleSide });
  const ring = new T.Mesh(new T.RingGeometry(R * 1.55, R * 1.57, 128), ringMat); ring.rotation.x = Math.PI / 2; world.add(ring);
  const sweepMat = new T.MeshBasicMaterial({ transparent: true, opacity: 0.18, side: T.DoubleSide, depthWrite: false });
  const sweep = new T.Mesh(new T.CircleGeometry(R * 1.56, 48, 0, Math.PI / 5), sweepMat); sweep.rotation.x = -Math.PI / 2; world.add(sweep);

  // Fuseaux horaires suivis par l'appli
  const ll = (lat, lon, r) => { const p = (90 - lat) * Math.PI / 180, t = (lon + 180) * Math.PI / 180;
    return new T.Vector3(-r * Math.sin(p) * Math.cos(t), r * Math.cos(p), r * Math.sin(p) * Math.sin(t)); };
  const pins = ZONES.map(([name, lat, lon]) => {
    const m = new T.Mesh(new T.SphereGeometry(name === "France" ? 0.06 : 0.04, 16, 12), new T.MeshBasicMaterial());
    m.position.copy(ll(lat, lon, R * 1.01)); m.userData.fr = name === "France"; globe.add(m);
    const halo = new T.Mesh(new T.RingGeometry(0.07, 0.09, 32), new T.MeshBasicMaterial({ transparent: true, side: T.DoubleSide }));
    halo.position.copy(ll(lat, lon, R * 1.02)); halo.lookAt(halo.position.clone().multiplyScalar(2)); halo.userData.fr = m.userData.fr; globe.add(halo);
    return [m, halo];
  });
  globe.rotation.y = -2.3; // la France face à nous au départ

  // Pokémon des 14 prochains jours, en orbite
  const now = parisNow(), loader = new T.TextureLoader(), orbit = [], seen = new Set();
  for (const e of upcoming(now).filter(x => x.start && d(x.start) < new Date(+now + 14 * 864e5)).sort((a, b) => b.score - a.score))
    for (const p of mons(e)) {
      const id = dexOf(p.name); if (!id || seen.has(id)) continue;
      seen.add(id); orbit.push({ e, p, id }); if (orbit.length >= 10) break;
    }
  const sprites = orbit.map((o, i) => {
    const mat = new T.SpriteMaterial({ map: loader.load(art(o.id, o.p.shiny && state.shinyAll)), transparent: true, depthWrite: false });
    const s = new T.Sprite(mat), k = i / orbit.length;
    s.userData = { ...o, a: k * Math.PI * 2, r: R * (1.4 + (i % 3) * 0.16), y: ((i % 4) - 1.5) * 0.38, sp: 0.18 + (i % 3) * 0.05, size: 0.42 + (o.e.score / 100) * 0.16 };
    s.scale.setScalar(s.userData.size); world.add(s); return s;
  });

  function paint() {
    const c = n => new T.Color(css(n) || "#0a9fb1");
    dotsMat.color = c("--accent"); coreMat.color = c("--surface"); ringMat.color = c("--accent"); sweepMat.color = c("--accent");
    for (const [m, h] of pins) { m.material.color = c(m.userData.fr ? "--raid" : "--star"); h.material.color = m.material.color; }
  }
  paint();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);

  function size() {
    const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); cam.aspect = w / h;
    cam.position.z = w / h < 0.9 ? 7.6 : 6.2; cam.updateProjectionMatrix();
  }
  new ResizeObserver(size).observe(cv); size();

  // Glisser pour tourner, toucher un Pokémon pour ouvrir son événement
  let drag = null, vel = 0, moved = 0;
  cv.addEventListener("pointerdown", ev => { drag = { x: ev.clientX, y: ev.clientY }; moved = 0; cv.setPointerCapture(ev.pointerId); });
  cv.addEventListener("pointermove", ev => {
    if (!drag) { hover(ev); return; }
    const dx = ev.clientX - drag.x; moved += Math.abs(dx) + Math.abs(ev.clientY - drag.y);
    globe.rotation.y += dx * 0.008; vel = dx * 0.008; drag.x = ev.clientX; drag.y = ev.clientY;
  });
  cv.addEventListener("pointerup", ev => { drag = null; if (moved < 6) { const s = pick(ev); if (s) openEv(s.userData.e); } });
  const ray = new T.Raycaster(), mv = new T.Vector2();
  function pick(ev) {
    const r = cv.getBoundingClientRect(); mv.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mv, cam); const hit = ray.intersectObjects(sprites)[0]; return hit && hit.object;
  }
  let hot = null;
  function hover(ev) { const s = pick(ev); if (s !== hot) { hot = s; cv.style.cursor = s ? "pointer" : ""; cv.title = s ? `${s.userData.p.name} · ${s.userData.e.name}` : ""; } }

  const clock = new T.Clock();
  (function loop() {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, m = still ? 0 : 1;
    if (!drag) { globe.rotation.y += (0.12 * m) * dt + vel; vel *= 0.92; }
    sweep.rotation.z -= dt * 1.4 * m;
    for (const s of sprites) {
      const u = s.userData, a = u.a + t * u.sp * m;
      s.position.set(Math.cos(a) * u.r, u.y + Math.sin(t * 1.3 + u.a) * 0.08 * m, Math.sin(a) * u.r);
      s.scale.setScalar(u.size * (s === hot ? 1.25 : 1));
    }
    for (const [mm, h] of pins) h.scale.setScalar(1 + (Math.sin(t * 3 + (mm.userData.fr ? 0 : 1)) * 0.25 + 0.25) * m);
    renderer.render(scene, cam);
    requestAnimationFrame(loop);
  })();
}

async function load() {
  let feed = null;
  try { const r = await fetch("feed.json", { cache: "no-store" }); if (r.ok) feed = await r.json(); } catch (e) {}
  feed = feed || FEED_FALLBACK || { events: [] };
  events = feed.events || []; updatedAt = feed.updatedAt || "";
  tick(); render(); renderNext(); initGlobe();
  if (!events.length) $("#list").append(el("div", "empty", "Impossible de charger les événements."));
}
load();
setInterval(tick, 15000);
setInterval(() => { render(); renderNext(); }, 60000);
</script>
